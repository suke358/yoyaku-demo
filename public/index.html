<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ご予約</title>
<!--
  Lift-Off 部品「予約カレンダー」お客さんの画面（2026/10/20）。お店ごとの値は /shop.jsonc（店名・色・メニュー・片づけの分 など）。
  考え方：お店は「営業時間」だけ入れる → お客さんがメニューを選ぶと、メニューの長さ＋片づけの時間で空いている開始時間が出る → 予約が入るとその分だけ埋まる。
  サーバー（/api）は「日にち・時間・埋まっている時間」と、お店の画面で見るための名前・電話・メール（来店日の翌日に自動で空）を持つ。お客さん向けの /api/days には名前などは出ない（2026/10/25）。
  名前・電話・メール（必須）を /api/book に渡し、サーバーがお店の Gmail（GAS）から確認メール＋知らせを送る（2026/10/21）。送れなければ予約は取り消され、案内が出る。
  デモ（shop.jsonc の demo: true）では、メールは送らず、予約のあとに確認メールの見本を出す。
-->
<style>
:root{--main:#e58ca0;--sub:#a8834f;--ink:#4a3a35;--soft:#fbeff2;--bg:#f7f2ea;--line:#e8dccf;--ok:#2f7a42;--okbg:#eef8f0;--okbd:#9fd3ab;--mute:#9c8a80}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.6}
button{font:inherit;cursor:pointer;color:inherit}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.top .ttl{font-size:12px;color:var(--mute);text-align:center;padding:8px 16px}
main{max-width:520px;margin:0 auto;padding:14px 16px 60px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
h2{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-weight:600;font-size:19px;text-align:center;margin:4px 0 0;letter-spacing:.12em}
.en{font-size:10px;text-align:center;color:var(--sub);letter-spacing:.25em;margin-bottom:12px}
.note{font-size:12.5px;color:#7d6a62}
label.f{display:block;font-size:13px;color:#6b5a52;margin:10px 0 4px}
.req{color:#d33;font-size:11px;margin-left:4px}
input[type=text],input[type=tel],input[type=email]{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.menus{display:flex;flex-direction:column;gap:8px}
.menus button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px}
.menus button.on{border-color:var(--main);background:var(--soft);font-weight:bold}
.menus button small{color:var(--mute);font-weight:normal;white-space:nowrap;margin-left:8px}
.menus button .ck{display:inline-block;width:18px;height:18px;border:1.5px solid var(--line);border-radius:5px;margin-right:8px;vertical-align:-3px;text-align:center;line-height:16px;font-size:12px;color:#fff;flex:none}
.menus button.on .ck{background:var(--main);border-color:var(--main)}
.menus button .nm{flex:1 1 auto;display:flex;align-items:center}
/* 選んだメニューのまとめ（施術の合計・所要時間・料金の目安。2026/10/28 複数メニュー） */
.selsum{font-size:13px;background:var(--soft);border-radius:10px;padding:8px 12px;margin-top:10px;line-height:1.6}
.selsum b{font-size:14px}
.day{border-bottom:1px dotted var(--line);padding:12px 0}
.day:last-child{border-bottom:0}
.dname{font-weight:bold;margin-bottom:6px}
.dname.full{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border-radius:999px;padding:7px 12px;font-size:14px;border:1px solid var(--okbd);color:var(--ok);background:var(--okbg)}
.full-t{font-size:13px;color:var(--mute)}
.other{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px;text-align:center}
.other .t{font-size:13.5px;margin-bottom:8px}
.linebtn{display:block;text-align:center;background:#06c755;color:#fff;text-decoration:none;border-radius:999px;padding:11px;font-weight:bold;margin-top:8px}
.telbtn{display:block;text-align:center;border:1px solid var(--line);color:var(--ink);text-decoration:none;border-radius:999px;padding:11px;font-weight:bold;margin-top:8px;background:#fff}
.sheet{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(40,30,28,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.sheet .box{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px 24px;max-height:92vh;overflow:auto}
.selbox{background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-weight:bold;text-align:center}
.policy{font-size:13px;background:#faf7f3;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:14px}
.agree{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:14px}
.agree input{width:20px;height:20px;margin-top:2px;flex:none}
.err{color:#d33;font-size:13px;min-height:18px;margin-top:6px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:bold;margin-top:12px}
.btn.main{background:var(--main);color:#fff}
.btn.main:disabled{opacity:.45}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.thanks{text-align:center}.thanks .big{font-size:40px;color:var(--main)}
.mailpre{white-space:pre-wrap;word-break:break-all;text-align:left;font:12.5px/1.6 -apple-system,"Hiragino Sans",sans-serif;background:#faf7f3;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0 0;color:var(--ink)}
.warn{font-size:13px;background:#fff6e5;border:1px solid #f3cf8a;border-radius:10px;padding:10px 12px;margin-top:10px;text-align:left;color:#7a5a16}
.stop{font-size:14px;background:#fff6e5;border:1px solid #f3cf8a;border-radius:10px;padding:12px 14px;color:#7a5a16;text-align:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#333;color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;opacity:0;transition:opacity .25s;z-index:30;pointer-events:none}
.toast.on{opacity:.92}
.empty{color:var(--mute);text-align:center;padding:14px 0;font-size:14px}
.foot{font-size:11px;color:var(--mute);text-align:center;margin-top:20px}
.foot a{color:var(--mute)}
/* ご予約の流れ（案内の枠。ボタンに見えない作り・押せない。2026/10/25） */
.guide{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:0 0 12px}
.guide .gt{font-size:13px;font-weight:bold;margin:0 0 8px}
.flow{display:flex;margin:0 -2px}
.flow .st{flex:1;position:relative;text-align:center;font-size:11px;line-height:1.35;color:var(--ink);padding:0 2px}
.flow .st::before{content:"";position:absolute;top:5px;left:-50%;right:50%;height:1.5px;background:var(--main);opacity:.45}
.flow .st:first-child::before{display:none}
.flow .dot{display:block;width:11px;height:11px;border:1.5px solid var(--main);border-radius:50%;background:#fff;margin:0 auto 5px;position:relative;z-index:1}
.flow .st.last .dot{background:var(--main)}
.flow .st.last{font-weight:bold}
.linetext{color:#06c755;text-decoration:underline}
/* もどるリンク：押せるボタンに見えるように（枠・15px・高さ44px以上・本文の色。2026/10/25） */
.back{display:none;font-size:15px;line-height:1.3;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;background:#fff;padding:12px 18px;min-height:44px;text-align:center}
.back.on{display:inline-block}
.topback{text-align:center;padding:0 16px 10px}
.bottomback{text-align:center;margin-top:16px}
.thanks .h{font-size:20px;font-weight:bold;margin:4px 0 8px}
/* 日付の横並び（横にスクロール。動きなし。flex の gap は使わず margin） */
.days{display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 0 8px;margin:8px -4px 0}
.dbtn{flex:none;width:56px;min-height:56px;margin:0 4px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 0;text-align:center;line-height:1.25}
.dbtn .dd{display:block;font-size:17px;font-weight:bold}
.dbtn .dw{display:block;font-size:11px;color:var(--mute)}
.dbtn .dm{display:block;font-size:10px;color:var(--mute)}
.dbtn[aria-pressed=true]{border-color:var(--main);background:var(--soft)}
.dbtn[aria-pressed=true] .dd{color:var(--main)}
.dbtn.noslot{opacity:.4;cursor:default}
.dsel{font-weight:bold;margin:10px 0 6px}
.chips{margin:-4px -4px 0}
.chip{margin:4px;min-height:44px;min-width:76px}
</style>
</head>
<body>
<div class="top"><div class="ttl" id="ttl">ご予約</div><div class="topback"><a class="back" id="backTop" href="#"></a></div></div>

<main>
  <div class="card">
    <h2>ご予約</h2><div class="en">RESERVATION</div>
    <div class="guide" aria-label="ご予約の流れ"><p class="gt">ご予約の流れ</p><div class="flow"><div class='st'><span class='dot'></span>メニュー</div><div class='st'><span class='dot'></span>日時</div><div class='st'><span class='dot'></span>お名前などの<wbr>入力</div><div class='st'><span class='dot'></span>送信</div><div class='st last'><span class='dot'></span>予約完了</div></div><p class="note" style="margin:8px 0 0">このページだけでご予約が完了します。</p></div>
    <p class="note" id="topNote" style="display:none;margin:0 0 10px"></p>
    <b>① メニューを選ぶ</b><span class="note" id="menuNote">（複数も選べます）</span>
    <p class="note" id="taxNote" style="display:none;margin:6px 0 0"></p>
    <div class="menus" id="menuList" style="margin-top:8px"></div>
    <div class="selsum" id="selSum"></div>
    <div id="otherMenus" style="display:none;margin-top:12px"><p class="note" id="otherMenusNote" style="margin:0"></p></div>
  </div>
  <div class="card">
    <b>② 日にちと時間を選ぶ</b>
    <div id="custList"><div class="empty">読みこみ中…</div></div>
    <p class="note" id="custNote" style="margin-top:8px">※完全予約制です。表示のない日・時間は、LINE・お電話でご相談ください。</p>
    <div class="other" id="other" style="display:none">
      <div class="t">ご相談・ご不明な点は</div>
      <a class="linebtn" id="lineBtn" href="#" target="_blank" rel="noopener" style="display:none">LINE で相談する</a>
      <a class="telbtn" id="telBtn" href="#" style="display:none"></a>
    </div>
  </div>
  <div class="bottomback"><a class="back" id="backBottom" href="#"></a></div>
  <div class="foot" id="foot">予約カレンダー（Lift-Off）</div>
</main>

<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>
<div class="toast" id="toast"></div>

<script>
var SHOP=null;        // /shop.jsonc（お店ごとの値）
var DOW=["日","月","火","水","木","金","土"];
var todayKey="", nowMin=0, cutoff=120, open=true;
var hours={};         // "YYYY-MM-DD" -> {s,e}
var busy={};          // "YYYY-MM-DD" -> [{s,e}]（埋まっている時間。中身は見えない）
var menuSel=[0], cur=null, daySel="";   // menuSel＝選んでいるメニューの番号の並び（複数可。1 つは必ず残す。2026/10/28）。daySel＝選んでいる日（横並びの日付）

function parse(k){var a=k.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function jp(k){var d=parse(k);return (d.getMonth()+1)+"月"+d.getDate()+"日（"+DOW[d.getDay()]+"）"}
function m2(t){var a=t.split(":");return +a[0]*60+ +a[1]}
function t2(m){return ("0"+Math.floor(m/60)).slice(-2)+":"+("0"+m%60).slice(-2)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove("on")},2200)}
function stopMsg(t){document.getElementById("custList").innerHTML="<div class='stop'>"+esc(t)+"</div>";document.getElementById("custNote").style.display="none"}
function parseJsonc(t){return JSON.parse(t.replace(/^\s*\/\/.*$/gm,"").replace(/[ \t]+\/\/[^"\n]*$/gm,""))}

/* 予約1回の長さ（枠をふさぐ分）：メニューの slot か、前の時間＋施術＋後の時間（サーバーと同じ計算。2026/10/21） */
function slotOf(m){return +m.slot||((+SHOP.preMin||0)+(+m.min)+(+SHOP.bufferMin||0))}
/* 複数メニュー（2026/10/28。サーバーの lenOf・priceOf と同じ計算）：1 つなら slotOf、2 つ以上なら 前＋施術の合計＋後（slot は使わない） */
function selMenus(){return menuSel.map(function(i){return SHOP.menus[i]})}
function lenOf(ms){if(ms.length==1)return slotOf(ms[0]);return (+SHOP.preMin||0)+minOf(ms)+extraOf(ms)+(+SHOP.bufferMin||0)}
function extraOf(ms){var t=0;ms.forEach(function(m){t+=+m.extraMin||0});return t}   // 複数のとき足す分（例 お化粧落とし。名前は shop.jsonc の extraNote）
function extraNotes(ms){var o=[];ms.forEach(function(m){var n=String(m.extraNote||"");if(+m.extraMin>0&&n&&o.indexOf(n)<0)o.push(n)});return o}
function maxTotal(){return +SHOP.maxTotalMin||0}   // 施術の合計の上限（分。0 ＝ なし）
function minOf(ms){var t=0;ms.forEach(function(m){t+=+m.min});return t}
function yen(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",")+"円"}
function priceOf(ms){if(ms.length==1)return ms[0].price||"";var sum=0,from=false,ask=false;ms.forEach(function(m){var x=/^([0-9,]+)\s*円(〜)?$/.exec(String(m.price||""));if(x){sum+=+x[1].replace(/,/g,"");if(x[2])from=true}else ask=true});return ask?"お問い合わせください":yen(sum)+(from?"〜":"")}
function namesOf(ms){return ms.map(function(m){return m.name}).join("＋")}
/* 選んだメニューのまとめの文（施術の合計・所要時間・料金の目安） */
function sumHtml(ms){
  var len=lenOf(ms),mn=minOf(ms),pr=priceOf(ms),many=ms.length>1;
  var ex=many?extraNotes(ms):[];
  var h="<b>"+esc(namesOf(ms))+"</b><br>施術 "+(many?"合計":"")+mn+"分"+(len!=mn?"・所要 約"+len+"分（カウンセリング・お片づけ"+(ex.length?"・"+esc(ex.join("・")):"")+"を含む）":"");
  if(pr)h+="<br>"+(many?"料金の目安　"+(/円/.test(pr)?"合計 ":""):"")+esc(pr)+(/円/.test(pr)?"（税込）":"");
  return h;
}
/* 空いている開始時間：来店〜（予約1回の長さ）が営業時間に入り、埋まっている時間（予約・予約停止）と重ならない。今日は、今＋締切より前の時間は出さない */
function starts(k,ms){
  var h=hours[k];if(!h)return [];
  var slot=lenOf(ms);
  var s=m2(h.s),e=m2(h.e),out=[],bl=busy[k]||[];
  for(var t=s;t+slot<=e;t+=SHOP.stepMin){
    if(k==todayKey&&t<nowMin+cutoff)continue;
    var end=t+slot, hit=bl.some(function(b){return t<m2(b.e)&&end>m2(b.s)});
    if(!hit)out.push(t2(t));
  }
  return out;
}

function applyShop(){
  var R=document.documentElement.style;R.setProperty("--main",SHOP.color.main);R.setProperty("--sub",SHOP.color.sub);
  document.title=SHOP.shopName+"　ご予約";
  document.getElementById("ttl").textContent=SHOP.shopName+"　ご予約";
  var o=document.getElementById("other"),lb=document.getElementById("lineBtn"),tb=document.getElementById("telBtn");
  if(SHOP.lineUrl){lb.href=SHOP.lineUrl;lb.style.display="block"}
  if(SHOP.tel){tb.href="tel:"+String(SHOP.tel).replace(/[^0-9+]/g,"");tb.textContent="電話する　"+SHOP.tel;tb.style.display="block"}
  if(SHOP.lineUrl||SHOP.tel)o.style.display="block";
  if(SHOP.topNote){var tn=document.getElementById("topNote");tn.textContent=SHOP.topNote;tn.style.display="block"}
  if(SHOP.taxNote){var tx=document.getElementById("taxNote");tx.textContent=SHOP.taxNote;tx.style.display="block"}
  if(maxTotal()>0)document.getElementById("menuNote").textContent="（複数も選べます・施術の合計 "+maxTotal()+"分まで）";
  if(SHOP.backUrl&&SHOP.backText){["backTop","backBottom"].forEach(function(id){var a=document.getElementById(id);a.href=SHOP.backUrl;a.textContent=SHOP.backText;a.className+=" on"})}
  if(SHOP.otherMenusNote){
    // 文の中の「公式LINE」だけ文字リンクに（lineUrl があるとき。なければ文のまま）。緑のボタンは出さない（2026/10/25）
    var on=esc(SHOP.otherMenusNote);
    if(SHOP.lineUrl)on=on.replace("公式LINE","<a class='linetext' href='"+esc(SHOP.lineUrl)+"' target='_blank' rel='noopener'>公式LINE</a>");
    document.getElementById("otherMenusNote").innerHTML=on;document.getElementById("otherMenus").style.display="block"}
  var w=[];if(SHOP.lineUrl)w.push("LINE");if(SHOP.tel)w.push("お電話");
  document.getElementById("custNote").textContent="※完全予約制です。表示のない日・時間は、"+(w.length?w.join("・")+"で":"お店に")+"ご相談ください。";
}

function load(){
  return fetch("/api/days",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("down");return r.json()}).then(function(d){
    todayKey=d.today;nowMin=m2(d.now||"00:00");cutoff=(d.sameDayCutoffMin===undefined)?120:+d.sameDayCutoffMin;open=d.open!==false;
    hours={};busy=d.busy||{};
    (d.hours||[]).forEach(function(h){hours[h.date]={s:h.s,e:h.e}});
    renderCust();
  }).catch(function(){stopMsg("ただいまネット予約が使えません。LINE かお電話でお願いします。")});
}

function renderCust(){
  document.getElementById("menuList").innerHTML=SHOP.menus.map(function(m,i){var on=menuSel.indexOf(i)>=0;
    return "<button class='"+(on?"on":"")+"' aria-pressed='"+(on?"true":"false")+"' onclick='pickMenu("+i+")'><span class='nm'><span class='ck' aria-hidden='true'>"+(on?"✓":"")+"</span>"+esc(m.name)+"</span><small>"+m.min+"分"+(m.price?"・"+esc(m.price):"")+"</small></button>"}).join("");
  var menu=selMenus();
  document.getElementById("selSum").innerHTML=sumHtml(menu);
  if(!open){stopMsg("ただいまネット予約の準備中です。LINE かお電話でお願いします。");return}
  /* 日付の横並び：営業日を横に並べ、選んだ日の時間だけを下に出す（営業日が増えてもページの長さは変わらない。2026/10/25）
     空きのない日は薄く・押せない（「空きなし」。予約停止で空きが消えることもあるので、埋まっているとは言い切らない） */
  var ks=Object.keys(hours).sort(),days=[];
  ks.forEach(function(k){var st=starts(k,menu);
    if(k==todayKey&&!st.length)return;   // 今日の分がもう受けられないときは出さない
    days.push({k:k,st:st})});
  var avail=days.filter(function(d){return d.st.length});
  if(!avail.length){document.getElementById("custList").innerHTML="<div class='empty'>いま予約できる日がありません。LINE・お電話でご相談ください。</div>";return}
  // 選んでいる日に空きがなければ（最初の表示・メニューを変えたとき）、いちばん近い空きのある日にする
  if(!avail.some(function(d){return d.k==daySel}))daySel=avail[0].k;
  var h="<div class='days' role='group' aria-label='日にちを選ぶ'>"+days.map(function(d){
    var dt=parse(d.k),on=d.k==daySel,no=!d.st.length;
    var name=(dt.getMonth()+1)+"月"+dt.getDate()+"日 "+DOW[dt.getDay()]+"曜日 "+(no?"空きなし":"空きあり");
    return "<button class='dbtn"+(no?" noslot":"")+"' aria-pressed='"+(on?"true":"false")+"' aria-label='"+name+"'"+(no?" disabled":" onclick=\"pickDay('"+d.k+"')\"")+">"+
      "<span class='dm'>"+(dt.getMonth()+1)+"月</span><span class='dd'>"+dt.getDate()+"</span><span class='dw'>"+DOW[dt.getDay()]+"</span></button>"}).join("")+"</div>";
  var sel=avail.filter(function(d){return d.k==daySel})[0];
  h+="<div class='dsel'>"+jp(sel.k)+"</div><div class='chips'>"+sel.st.map(function(t){return "<button class='chip' aria-label='"+t+"から予約する' onclick=\"openForm('"+sel.k+"','"+t+"')\">"+t+"〜</button>"}).join("")+"</div>";
  document.getElementById("custList").innerHTML=h;
}
function pickMenu(i){   // 押すたびに選ぶ／外す。1 つは必ず残す（全部外すと空きを出せないため）
  var at=menuSel.indexOf(i);
  if(at>=0){if(menuSel.length==1){toast("メニューは 1 つ以上お選びください");return}menuSel.splice(at,1)}
  else{
    if(maxTotal()>0&&minOf(selMenus())+(+SHOP.menus[i].min)>maxTotal()){toast("施術の合計は "+maxTotal()+" 分までです");return}   // 上限を越える組み合わせは選べない
    menuSel.push(i)}
  menuSel.sort(function(a,b){return a-b});
  renderCust()}
function pickDay(k){daySel=k;renderCust()}

function openForm(k,t){
  var ms=selMenus();cur={k:k,t:t,m:menuSel.slice()};
  document.getElementById("sheetBox").innerHTML=
   "<div class='selbox'>"+jp(k)+"　"+t+"〜<br><span style='font-weight:normal;font-size:13px'>"+sumHtml(ms)+"</span></div>"+
   "<label class='f'>お名前<span class='req'>必須</span></label><input type='text' id='fName' autocomplete='name' placeholder='例：山田 花子'>"+
   "<label class='f'>電話番号<span class='req'>必須</span></label><input type='tel' id='fTel' autocomplete='tel' placeholder='例：090-1234-5678'>"+
   "<label class='f'>メールアドレス<span class='req'>必須</span></label><input type='email' id='fMail' autocomplete='email' inputmode='email' placeholder='例：hanako@example.com'><p class='note' style='margin:4px 0 0'>確認メールをお送りします。お間違いのないようにご入力ください。</p>"+(SHOP.demo===true?"<p class='note' style='margin:6px 0 0'><b>デモです。実際のお名前・電話・メールは入れないでください</b></p>":"")+
   "<div class='policy'><b>キャンセルについて</b><br>"+esc(SHOP.cancelPolicy)+"<br>ご変更・キャンセルは LINE かお電話でお知らせください。"+(SHOP.notice?"<br><b>"+esc(SHOP.notice)+"</b>":"")+"<label class='agree'><input type='checkbox' id='fAgree' onchange=\"document.getElementById('fSend').disabled=!this.checked\">キャンセルの決まりを確認しました</label></div>"+
   "<div class='err' id='fErr'></div><button class='btn main' id='fSend' onclick='send()' disabled>この内容で予約する</button><button class='btn ghost' onclick='closeForm()'>やめる</button>";
  document.getElementById("sheet").classList.add("on");
}
function closeForm(){document.getElementById("sheet").classList.remove("on");cur=null}
document.getElementById("sheet").onclick=function(e){if(e.target.id=="sheet")closeForm()};

function send(){
  var n=document.getElementById("fName").value.trim(),t=document.getElementById("fTel").value.trim(),ml=document.getElementById("fMail").value.trim(),e=document.getElementById("fErr");
  if(!n){e.textContent="お名前を入れてください";return}
  if(!/^[0-9\-]{10,13}$/.test(t)){e.textContent="電話番号を数字で入れてください";return}
  if(!ml){e.textContent="メールアドレスを入れてください（確認メールをお送りします）";return}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(ml)){e.textContent="メールアドレスの形を確かめてください";return}
  var ms=cur.m.map(function(i){return SHOP.menus[i]}), c=cur, btn=document.getElementById("fSend");
  btn.disabled=true;btn.textContent="送っています…";e.textContent="";
  var body={date:c.k,start:c.t,menus:ms.map(function(m){return m.name}),name:n,tel:t,email:ml};   // 枠の長さ・料金はサーバーがメニューから決める（menus＝名前の並び。1 つでも配列。2026/10/28）   // サーバーが枠を取り、メールを送る（名前・電話・メールはお店の画面用に預かり、来店日の翌日に空になる）
  fetch("/api/book",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)})
  .then(function(r){return r.json().then(function(j){return {status:r.status,body:j}})})
  .then(function(res){
    if(res.status==409){e.textContent="すみません、たった今ほかの方の予約が入りました。別の時間をお選びください。";btn.disabled=false;btn.textContent="この内容で予約する";load();return}
    if(res.status==502){e.innerHTML="<div class='warn'>"+esc((res.body&&res.body.error)||"ご予約を完了できませんでした。お手数ですが LINE かお電話でご連絡ください")+"</div>";btn.disabled=false;btn.textContent="この内容で予約する";load();return}
    if(res.status!=200){e.textContent=(res.body&&res.body.error)||"予約できませんでした。もう一度お試しください。";btn.disabled=false;btn.textContent="この内容で予約する";return}
    var when=jp(c.k)+" "+c.t+"〜";
    var h="<div class='thanks'><div class='big'>✓</div><div class='h'>ご予約を受け付けました</div><p class='note'>"+esc(when)+"<br>"+esc(namesOf(ms))+(ms.length>1?"<br>施術 合計"+minOf(ms)+"分・所要 約"+lenOf(ms)+"分":"")+"</p>";
    // 場所（住所・駐車場・地図・電話）。値があるものだけ（shop.jsonc）
    var pl=[];
    if(SHOP.address)pl.push(esc(SHOP.address));
    if(SHOP.parking)pl.push(esc(SHOP.parking));
    if(SHOP.mapUrl)pl.push("<a href='"+esc(SHOP.mapUrl)+"' target='_blank' rel='noopener'>Googleマップで道順を見る</a>");
    if(SHOP.tel)pl.push("お電話　<a href='tel:"+esc(String(SHOP.tel).replace(/[^0-9+]/g,""))+"'>"+esc(SHOP.tel)+"</a>");
    if(pl.length)h+="<div class='policy' style='text-align:left'><b>■ 場所</b><br>"+pl.join("<br>")+"</div>";
    // 確認メールが届かないときの案内（デモはメールを送っていないので出さない）と、HP にもどるボタン（shop.jsonc に backUrl・backText があるときだけ）
    var w2=[];if(SHOP.lineUrl)w2.push("LINE");if(SHOP.tel)w2.push("お電話");
    if(res.body&&res.body.mail===false)h+="<p class='note warn'>"+esc(res.body.note||"確認メールをお送りできませんでした。確認メールが届かない場合は LINE かお電話でご連絡ください")+"</p>";   // メールを送れなかったが予約は入っている（2026/10/26）
    if(!(res.body&&res.body.demo))h+="<p class='note' style='margin-top:10px'>確認メールが届かないときは、迷惑メールをご確認のうえ、"+(w2.length?w2.join("か")+"で":"お店に")+"ご連絡ください。</p>";
    if(SHOP.backUrl&&SHOP.backText)h+="<div class='bottomback' style='margin-top:12px'><a class='back on' href='"+esc(SHOP.backUrl)+"'>"+esc(SHOP.backText)+"</a></div>";
    if(res.body&&res.body.demo){
      // デモ：メールは送っていない。本番で届くメールの見本を出す
      h+="<div class='warn'>これはデモです。メールは送っていません。<br>本番では、次の確認メールがお客さまに、予約の知らせがお店に届きます。</div>"+
         "<pre class='mailpre'>"+esc(res.body.mailPreview||"")+"</pre>";
    }else{
      h+="<p class='note'>"+esc(ml)+" に確認メールをお送りしました。届かないときは迷惑メールもご確認ください。<br>当日お待ちしております。</p>";
    }
    document.getElementById("sheetBox").innerHTML=h+"<button class='btn main' onclick='closeForm()'>とじる</button></div>";
    load();
  })
  .catch(function(){e.textContent="通信に失敗しました。もう一度お試しください。";btn.disabled=false;btn.textContent="この内容で予約する"});
}

fetch("/shop.jsonc",{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){SHOP=parseJsonc(t);applyShop();renderCust();return load()})
.catch(function(){stopMsg("ただいまネット予約が使えません。LINE かお電話でお願いします。")});
</script>
</body>
</html>
