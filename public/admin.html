<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>予約管理</title>
<!--
  Lift-Off 部品「予約カレンダー」お店の画面（2026/10/20）。お店ごとの値は /shop.jsonc。
  営業日を型で入れる・型を作る直す・予約を見る入れる・予約の型・取り消す・営業時間の変更。
  最初にパスワードを聞き、ブラウザに覚えさせる（localStorage）。API は /api/admin/…（ヘッダー X-Admin-Password）
  ホーム画面に置くと「〇〇 予約管理」の名前とアイコン（/manifest.webmanifest・/apple-touch-icon.png）
-->
<style>
:root{--main:#e58ca0;--sub:#a8834f;--ink:#4a3a35;--soft:#fbeff2;--bg:#f7f2ea;--line:#e8dccf;--ok:#2f7a42;--okbg:#eef8f0;--okbd:#9fd3ab;--mute:#9c8a80;
  --bg-accent:#e8f0fb;--border-accent:#9ab6e0;--text-accent:#1f4e8c;   /* 予約の行（薄い青・青い枠・濃い青の文字）2026/10/25 */
  --stop:#4b5563;   /* 予約停止の行（gray-600 相当の固定の灰色。モードが変わっても同じ） */
  color-scheme:light}   /* この画面は白地で固定。文字は濃い色なのでダークモードの端末でもそのまま読める */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.6}
button{font:inherit;cursor:pointer;color:inherit}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.top .ttl{font-size:12px;color:var(--mute);text-align:center;padding:8px 16px}
main{max-width:520px;margin:0 auto;padding:14px 16px 60px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.note{font-size:12.5px;color:#7d6a62}
.hint{font-size:12px;background:var(--soft);border-radius:10px;padding:8px 12px;margin:0 0 12px;color:#7d5a63}
label.f{display:block;font-size:13px;color:#6b5a52;margin:10px 0 4px}
input[type=text],input[type=password],select{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.agree{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:14px}
.agree input{width:20px;height:20px;margin-top:2px;flex:none}
.err{color:var(--ink);font-weight:bold;font-size:13px;min-height:18px;margin-top:6px}   /* 赤は使わない */
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:bold;margin-top:12px}
.btn.main{background:var(--main);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.pat{display:flex;gap:6px;flex-wrap:wrap}
.pat button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;text-align:center;flex:1 1 28%}
.pat button small{display:block;font-size:11px;color:var(--mute)}
.pat button.on{border-color:var(--main);background:var(--main);color:#fff}
.pat button.on small{color:#fff}
.pat button.off.on{background:#7d6a62;border-color:#7d6a62}
.mode{display:flex;gap:6px;margin-bottom:10px}
.mode button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;font-size:14px}
.mode button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:bold}
.month-h{display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px}
.month-h button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{font-size:11px;text-align:center;color:var(--mute)}.dow.sun,.dow.sat{color:var(--mute)}   /* 赤は使わない */
.dc{height:50px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.dc.open{background:var(--soft);border-color:var(--main)}
.dc.full{background:#efe9e6;border-color:#c9bcb6}
.dc.sel{outline:2px solid var(--sub);outline-offset:1px}
.dc.past{opacity:.35}
.dc small{font-size:9px;line-height:1.15;color:var(--main)}
.dc small.bk{color:var(--text-accent);font-weight:bold}   /* ●＝ネット予約あり（青）*/
.dc small.fl{color:#7d6a62;font-weight:bold}
.ti .mlng{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:8px;background:#fff3cd;color:#7a4b00;border:1px solid #e0b24a;font-size:11px;font-weight:bold;vertical-align:middle}   /* 確認メールを送れなかった予約（お店から連絡する）*/
.hours{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}
.hours select{width:auto;font-size:15px;padding:7px}
.tl{margin-top:10px}
.ti{display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:10px;padding:9px 11px;margin-top:6px;font-size:14px}
.ti.net,.ti.man{background:var(--bg-accent);border:1px solid var(--border-accent)}   /* 予約の行（薄い青）*/
.ti.stop{background:var(--stop);border:1px solid var(--stop);color:#fff}   /* 予約停止（濃い灰色・白い文字）*/
.ti button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;color:var(--ink)}
.ti.stop button{border-color:#fff;color:var(--stop)}
.ti .nm{font-weight:bold;font-size:15px}
.ti .tm{margin-left:8px;font-size:13px}
.tag{display:inline-block;font-size:11px;line-height:1.5;border-radius:6px;padding:0 6px;margin-right:5px;vertical-align:middle;border:1px solid var(--text-accent)}
.tag.net{background:var(--text-accent);color:#fff}   /* ネット＝濃い青の札（白い文字）*/
.tag.man{background:#fff;color:var(--text-accent)}   /* LINE・電話＝白い札（青い枠・青い文字）*/
.ti .ct{display:block;font-size:12px;margin-top:2px}
.ti .ct a{color:var(--text-accent)}
.ti .ct a.tel{font-size:11px;margin-left:10px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline}
.dayhead small{color:var(--mute);font-size:12px;white-space:nowrap;margin-left:8px}
details.fold{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
details.fold summary{cursor:pointer;font-weight:bold;list-style:none;padding:4px 0}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:"▸ "}
details.fold[open] summary::before{content:"▾ "}
.blk{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.blk select{width:auto;font-size:15px;padding:7px}
.smallbtn{border:1px solid var(--sub);color:var(--sub);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px}
.pe{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fffdfb}
.pe .r{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;padding:6px 0;border-bottom:1px dotted var(--line)}
.pe .r:last-of-type{border-bottom:0}
.pe input[type=text]{width:auto;flex:1 1 4em;min-width:0;font-size:15px;padding:7px 6px}
.pe select{width:auto;flex:none;font-size:15px;padding:6px 2px}
.pe .x{flex:none;border:1px solid #ddd;background:#fff;border-radius:8px;padding:6px 9px;color:#999;font-size:13px}
.pe .acts{display:flex;gap:8px;margin-top:10px}
.pe .acts button{flex:1;border-radius:10px;padding:9px;font-size:14px;font-weight:bold}
details.more{font-size:13px;color:#7d6a62}
details.more summary{cursor:pointer;padding:4px 0}
.sub{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#333;color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;opacity:0;transition:opacity .25s;z-index:30;pointer-events:none}
.toast.on{opacity:.92}
.empty{color:var(--mute);text-align:center;padding:14px 0;font-size:14px}
.foot{font-size:11px;color:var(--mute);text-align:center;margin-top:20px}
.foot a{color:var(--mute)}
</style>
</head>
<body>
<div class="top"><div class="ttl" id="ttl">予約管理</div></div>

<main>
<section id="login" style="display:none">
  <div class="card">
    <b>お店の画面</b>
    <p class="note">パスワードを入れると、このスマホ（ブラウザ）に覚えさせます。</p>
    <label class="f">パスワード</label><input type="password" id="pw" autocomplete="current-password">
    <p class="note" id="demoPw" style="display:none"></p>
    <div class="err" id="pwErr"></div>
    <button class="btn main" onclick="doLogin()">入る</button>
  </div>
</section>

<section id="app" style="display:none">
  <div class="hint">お店の人がスマホで使う画面（ホーム画面にアイコンで置けます：共有 → ホーム画面に追加）。</div>
  <div class="card">
    <div class="mode"><button id="mPat" class="on" onclick="setMode('pat')">営業日を入れる</button><button id="mDay" onclick="setMode('day')">予約を見る・入れる</button></div>
    <div id="patBox">
      <div class="note" style="margin-bottom:6px">営業時間を選んで、日にちを続けて押してください。（「休み」で消せます）</div>
      <div class="pat" id="pat"></div>
      <div id="patEdit" style="margin-top:8px"></div>
    </div>
    <div class="month-h"><button onclick="moveMonth(-1)">‹</button><b id="mTitle"></b><button onclick="moveMonth(1)">›</button></div>
    <div class="month" id="month"></div>
    <p class="note" style="margin-top:8px">ピンク＝営業日（時間を表示）／灰色＝もう予約できない／<span style="color:var(--text-accent)">●</span>＝ネット予約あり</p>
  </div>
  <div class="card" id="dayBox" style="display:none"></div>
  <div class="foot"><a href="/">お客さんの画面</a>｜<a href="#" onclick="logout();return false">このスマホから出る</a></div>
</section>
</main>
<div class="toast" id="toast"></div>

<script>
var SHOP=null;   // /shop.jsonc
var PW_KEY="yoyakuAdminPw";
var DOW=["日","月","火","水","木","金","土"];
var today=new Date();today.setHours(0,0,0,0);
var view=new Date(today.getFullYear(),today.getMonth(),1);
var hours={}, blocks={}, sel=null, mode="pat", pat=0, editPat=false, editB=false;
var PATS=[], BPATS=[];

function key(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function parse(k){var a=k.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function jp(k){var d=parse(k);return (d.getMonth()+1)+"月"+d.getDate()+"日（"+DOW[d.getDay()]+"）"}
function m2(t){var a=t.split(":");return +a[0]*60+ +a[1]}
function t2(m){return ("0"+Math.floor(m/60)).slice(-2)+":"+("0"+m%60).slice(-2)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove("on")},2000)}
function parseJsonc(t){return JSON.parse(t.replace(/^\s*\/\/.*$/gm,"").replace(/[ \t]+\/\/[^"\n]*$/gm,""))}

/* ---------- 画面の押しもの（data 属性で受ける。設定の名前を JS の文字列に埋め込まない。2026/10/26） ---------- */
document.addEventListener("click",function(e){
  var t=e.target,i=0;
  while(t&&t!==document&&i<5){
    if(t.getAttribute){
      var v=t.getAttribute("data-pat");if(v!==null){pat=+v;renderAdmin();return;}
      if(t.getAttribute("data-act")==="editPat"){editPat=true;renderAdmin();return;}
      var b=t.getAttribute("data-bp");if(b!==null&&BPATS[+b]){block(+BPATS[+b].min,String(BPATS[+b].name));return;}
    }
    t=t.parentNode;i++;
  }
});
/* ---------- パスワードと API ---------- */
function getPw(){try{return localStorage.getItem(PW_KEY)||""}catch(e){return ""}}
function api(path,method,body){
  return fetch("/api/admin/"+path,{method:method||"GET",headers:{"content-type":"application/json","X-Admin-Password":getPw()},body:body?JSON.stringify(body):undefined,cache:"no-store"})
  .then(function(r){return r.json().catch(function(){return {}}).then(function(j){
    if(r.status==401){logout();throw new Error("パスワードが違います");}
    if(r.status==429)throw new Error("しばらくしてからお試しください");   // 合言葉を何度も間違えて止まっている（理由・残り時間は出さない）
    if(!r.ok)throw new Error(j.error||("エラー "+r.status));
    return j})});
}
function showLogin(msg){document.getElementById("login").style.display="block";document.getElementById("app").style.display="none";document.getElementById("pwErr").textContent=msg||"";}
function doLogin(){
  var v=document.getElementById("pw").value;
  if(!v){document.getElementById("pwErr").textContent="パスワードを入れてください";return}
  try{localStorage.setItem(PW_KEY,v)}catch(e){}
  api("login","POST",{}).then(function(){start()}).catch(function(e){try{localStorage.removeItem(PW_KEY)}catch(x){}showLogin(e.message)});
}
function logout(){try{localStorage.removeItem(PW_KEY)}catch(e){}showLogin("");}
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key=="Enter")doLogin()});

function start(){
  document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";
  return reload();
}
function reload(){
  return api("all").then(function(d){
    hours={};blocks={};
    if(d.today){var t=parse(d.today);today=t;}   // 日本時間の今日（サーバーから）
    (d.hours||[]).forEach(function(h){hours[h.date]={s:h.s,e:h.e}});
    (d.blocks||[]).forEach(function(b){(blocks[b.date]=blocks[b.date]||[]).push(b)});
    var st=d.settings||{};
    PATS=(st.pats&&st.pats.length)?st.pats:SHOP.patterns.map(function(p){return {name:p.name,s:p.s,e:p.e}});
    BPATS=(st.bpats&&st.bpats.length)?st.bpats:SHOP.bookPatterns.map(function(p){return {name:p.name,min:p.min}});
    if(pat>=PATS.length)pat=0;
    renderAdmin();
  }).catch(function(e){toast(e.message)});
}

/* 予約1回の長さ（枠をふさぐ分）：メニューの slot か、前の時間＋施術＋後の時間（お客さんの画面・サーバーと同じ計算。2026/10/21） */
function PRE(){return +SHOP.preMin||0}
function POST(){return +SHOP.bufferMin||0}
function slotOf(m){return +m.slot||(PRE()+(+m.min)+POST())}
/* 空いている開始時間（お客さんの画面と同じ計算。len＝予約1回の長さ） */
function starts(k,len){
  var h=hours[k];if(!h)return [];
  var s=m2(h.s),e=m2(h.e),out=[],bl=blocks[k]||[];
  for(var t=s;t+len<=e;t+=SHOP.stepMin){
    var end=t+len, hit=bl.some(function(b){return t<m2(b.e)&&end>m2(b.s)});
    if(!hit)out.push(t2(t));
  }
  return out;
}
function shortest(){return Math.min.apply(null,SHOP.menus.map(function(m){return slotOf(m)}))}

/* ---------- 画面 ---------- */
function setMode(m){mode=m;document.getElementById("mPat").classList.toggle("on",m=="pat");document.getElementById("mDay").classList.toggle("on",m=="day");
  document.getElementById("patBox").style.display=m=="pat"?"block":"none";
  if(m=="day"&&!sel){var ks=Object.keys(hours).filter(function(k){return parse(k)>=today}).sort();sel=ks[0]||null}
  renderAdmin()}
function moveMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);renderAdmin()}
function renderAdmin(){
  var ph="";PATS.forEach(function(p,i){ph+="<button class='"+(pat==i?"on":"")+"' data-pat='"+i+"'>"+esc(p.name)+"<small>"+esc(p.s)+"〜"+esc(p.e)+"</small></button>"});
  ph+="<button class='off "+(pat==-1?"on":"")+"' data-pat='-1'>休み<small>消す</small></button>";
  document.getElementById("pat").innerHTML=ph;
  document.getElementById("patEdit").innerHTML=editPat?patEditor():"<button class='smallbtn' data-act='editPat'>✎ 営業時間の組み合わせを作る・直す</button>";
  document.getElementById("mTitle").textContent=view.getFullYear()+"年"+(view.getMonth()+1)+"月";
  var h="";DOW.forEach(function(w,i){h+="<div class='dow"+(i==0?" sun":i==6?" sat":"")+"'>"+w+"</div>"});
  var first=view.getDay(),n=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  for(var i=0;i<first;i++)h+="<div></div>";
  var sm=shortest();
  for(var d=1;d<=n;d++){
    var dt=new Date(view.getFullYear(),view.getMonth(),d),k=key(dt),hh=hours[k],past=dt<today;
    var net=(blocks[k]||[]).some(function(b){return b.kind=="net"}),full=hh&&starts(k,sm).length==0;
    var mk=hh?((net?"<small class='bk'>●予約</small>":"")+(full?"<small class='fl'>満席</small>":"<small>"+esc(hh.s.replace(":00",""))+"-"+esc(hh.e.replace(":00",""))+"</small>")):"";
    h+="<button class='dc"+(hh?(full?" full":" open"):"")+(mode=="day"&&k==sel?" sel":"")+(past?" past":"")+"' "+(past?"disabled":"onclick=\"tapDay('"+k+"')\"")+">"+d+mk+"</button>";
  }
  document.getElementById("month").innerHTML=h;
  renderDay();
}
function tapDay(k){
  if(mode=="pat"){
    if(pat==-1){
      api("hours","DELETE",{date:k}).then(function(){toast(jp(k)+" を休みにしました");return reload()}).catch(function(e){toast(e.message)});
    } else {var p=PATS[pat];
      api("hours","POST",{date:k,s:p.s,e:p.e}).then(function(){toast(jp(k)+" "+p.s+"〜"+p.e);return reload()}).catch(function(e){toast(e.message)});
    }
  } else {sel=k;renderAdmin()}
}
var tOpts=[];
function opts(v){return tOpts.map(function(t){return "<option"+(t==v?" selected":"")+">"+t+"</option>"}).join("")}
function renderDay(){
  var b=document.getElementById("dayBox");
  if(mode!="day"||!sel){b.style.display="none";return}
  b.style.display="block";var hh=hours[sel];
  if(!hh){b.innerHTML="<div class='dayhead'><b>"+jp(sel)+"</b></div><div class='empty'>この日は休みです。「営業日を入れる」で営業時間を当ててください。</div>";return}
  // 日の見出し（右に小さく営業時間）→ 予約と予約停止の一覧（時間順。空きの行は出さない）→ 折りたたみ（2026/10/25）
  var h="<div class='dayhead'><b>"+jp(sel)+"</b><small>営業 "+esc(hh.s)+"〜"+esc(hh.e)+"</small></div>";
  var bl=(blocks[sel]||[]).slice().sort(function(a,c){return a.s<c.s?-1:1});
  h+="<div class='tl'>";
  if(!bl.length)h+="<div class='empty'>この日の予約はまだありません</div>";
  bl.forEach(function(x){
    if(x.kind=="stop"){
      h+="<div class='ti stop'><span><b>予約停止</b>　"+esc(x.s)+"〜"+esc(x.e)+"<br><small>この時間はネット予約に出ません</small></span><button onclick=\"unblock('"+esc(x.id)+"','予約停止をやめました（HP でまた予約できます）')\">予約停止をやめる</button></div>";
      return;
    }
    var net=x.kind=="net", nm=x.name||(net?"（お名前なし）":"LINE・電話の予約");
    var ct="";
    if(net){   // ネット予約：メール（押すとメール作成）を先に、電話はさらに小さく
      if(x.email)ct+="<a href='mailto:"+encodeURIComponent(x.email)+"'>"+esc(x.email)+"</a>";   // 宛先は encode してから（? & などが指定として効かないように）
      if(x.tel)ct+="<a class='tel' href='tel:"+esc(String(x.tel).replace(/[^0-9+]/g,""))+"'>"+esc(x.tel)+"</a>";
    }
    h+="<div class='ti "+(net?"net":"man")+"'><span><span class='nm'>"+esc(nm)+"</span><span class='tm'>"+esc(x.s)+"〜"+esc(x.e)+"</span>"+(x.mailng?"<span class='mlng'>メール未送</span>":"")+"<br>"+
       "<span class='tag "+(net?"net":"man")+"'>"+(net?"ネット":"LINE・電話")+"</span>"+esc(x.menu||"")+"<small style='color:var(--mute)'>（カウンセリング・お片づけを含む）</small>"+
       (ct?"<span class='ct'>"+ct+"</span>":"")+"</span><button onclick=\"unblock('"+esc(x.id)+"')\">予約を取り消す</button></div>";
  });
  h+="</div>";
  // この日の営業時間を変える（折りたたみ）
  h+="<details class='fold'><summary>この日の営業時間を変える</summary><div class='hours'>営業時間 <select onchange='chH(\"s\",this.value)'>"+opts(hh.s)+"</select>〜<select onchange='chH(\"e\",this.value)'>"+opts(hh.e)+"</select></div></details>";
  var fs=firstFree()||hh.s;
  // 折りたたみ1：LINE・電話で受けた予約を入れる（初期は閉じる）
  h+="<details class='fold'><summary>LINE・電話で受けた予約を入れる</summary>"+
    "<div class='blk'>始まり <select id='bS' onchange='syncEnd()'>"+opts10(fs)+"</select></div>"+
    "<label class='f'>お名前（任意）</label><input type='text' id='bName' maxlength='40' placeholder='例：山田 花子' autocomplete='off'>"+
    (SHOP.demo===true?"<div class='note' style='margin-top:4px'>デモです。実際のお名前・電話・メールは入れないでください</div>":"")+
    "<div class='note' style='margin:8px 0 6px'>メニューを押すと、その長さで入ります（前"+PRE()+"分・後"+POST()+"分も自動で）</div><div class='pat'>";
  BPATS.forEach(function(p,i){h+="<button data-bp='"+i+"'>"+esc(p.name)+"<small>"+(+p.min)+"分</small></button>"});
  h+="</div><div style='margin-top:8px'>"+(editB?bpatEditor():"<button class='smallbtn' onclick='editB=true;renderDay()'>✎ メニューを作る・直す</button>")+"</div>";
  h+="<details class='more' style='margin-top:12px'><summary>終わりの時間を選んで入れる</summary>"+
    "<div class='blk'>〜 <select id='bE'>"+opts10(t2(m2(fs)+60))+"</select></div>"+
    "<label class='agree' style='margin-top:8px'><input type='checkbox' id='bBuf' checked>あとに片づけの時間（"+POST()+"分）も入れる</label>"+
    "<button class='btn main' style='margin-top:8px' onclick='blockFree()'>この時間で予約を入れる</button></details></details>";
  // 折りたたみ2：この時間は予約停止（名前・内容なし。お客さんの画面ではその時間が空きに出ないだけ。2026/10/21）
  h+="<details class='fold'><summary>この時間は予約停止</summary><div class='note'>ネット予約を受けない時間を入れます（休憩・外出・予約の前後をあけたいとき など）。</div>"+
    "<div class='blk'><select id='sS'>"+opts10(fs)+"</select>〜<select id='sE'>"+opts10(t2(Math.min(m2(fs)+60,23*60)))+"</select></div>"+
    "<button class='btn ghost' style='margin-top:8px;border-color:var(--stop);color:var(--stop)' onclick='stopFree()'>この時間を予約停止にする</button></details>";
  b.innerHTML=h;
}
function firstFree(){var st=starts(sel,shortest());return st[0]}
function chH(w,v){var hh=hours[sel],n={s:hh.s,e:hh.e};n[w]=v;if(m2(n.s)>=m2(n.e)){toast("終わりを始まりより後にしてください");renderAdmin();return}
  api("hours","POST",{date:sel,s:n.s,e:n.e}).then(function(){toast("営業時間を変えました");return reload()}).catch(function(e){toast(e.message);renderAdmin()})}
var t10=[];for(var mm=6*60;mm<=23*60;mm+=10)t10.push(t2(mm));
function opts10(v){return t10.map(function(t){return "<option"+(t==v?" selected":"")+">"+t+"</option>"}).join("")}
function syncEnd(){var s=document.getElementById("bS").value,e=document.getElementById("bE");if(!e)return;if(m2(e.value)<=m2(s))e.value=t2(Math.min(m2(s)+60,23*60))}
function bName(){var el=document.getElementById("bName");return el?el.value.trim():""}
function addBlock(s,e,label,menu,kind){var hh=hours[sel];
  if(m2(s)<m2(hh.s)||m2(e)>m2(hh.e)+POST()){toast("営業時間の外です（営業時間を先に変えてください）");return}
  api("block","POST",{date:sel,s:s,e:e,menu:menu||"",kind:kind||"man",name:kind=="stop"?"":bName()}).then(function(){toast(label);return reload()}).catch(function(e){toast(e.message)})}
function stopFree(){var s=document.getElementById("sS").value,e=document.getElementById("sE").value;
  if(m2(e)<=m2(s)){toast("終わりを始まりより後にしてください");return}
  addBlock(s,e,s+"〜"+e+" を予約停止にしました","","stop")}
function blockFree(){var s=document.getElementById("bS").value,e=document.getElementById("bE").value;
  if(m2(e)<=m2(s)){toast("終わりを始まりより後にしてください");return}
  var buf=document.getElementById("bBuf").checked?POST():0;
  addBlock(s,t2(m2(e)+buf),s+"〜"+e+" の予約を入れました","")}
function block(mn,name){var s=document.getElementById("bS").value;var mm=null;SHOP.menus.forEach(function(x){if(x.name==name)mm=x});var len=mm?slotOf(mm):PRE()+mn+POST();
  addBlock(s,t2(m2(s)+len),s+" から "+(name?name+" ":"")+len+"分（カウンセリング・お片づけを含む）の予約を入れました",name)}
function unblock(id,msg){api("block","DELETE",{id:id}).then(function(){toast(msg||"あけました（HP でまた予約できます）");return reload()}).catch(function(e){toast(e.message)})}

/* 予約の型（お店が変えられる） */
var lens=[];for(var L=10;L<=240;L+=10)lens.push(L);
function bpatEditor(){
  var h="<div class='pe'><div class='note' style='margin-bottom:4px'>よく受けるメニューの名前と長さです（最大8つ）。</div>";
  BPATS.forEach(function(p,i){h+="<div class='r'><input type='text' value='"+esc(p.name)+"' maxlength='10' oninput='BPATS["+i+"].name=this.value'>"+
    "<select onchange='BPATS["+i+"].min=+this.value'>"+lens.map(function(l){return "<option value='"+l+"'"+(l==p.min?" selected":"")+">"+l+"分</option>"}).join("")+"</select>"+
    "<button class='x' onclick='delBpat("+i+")'>✕</button></div>"});
  h+="<div class='acts'>"+(BPATS.length<8?"<button style='border:1px solid var(--main);color:var(--main);background:#fff' onclick='BPATS.push({name:\"新しいメニュー\",min:60});renderDay()'>＋ メニューを足す</button>":"")+
     "<button style='border:0;background:var(--main);color:#fff' onclick='saveBpat()'>完了</button></div></div>";return h}
function delBpat(i){if(BPATS.length<=1){toast("メニューは1つ以上いります");return}BPATS.splice(i,1);renderDay()}
function saveBpat(){for(var i=0;i<BPATS.length;i++)if(!BPATS[i].name.trim()){toast("名前を入れてください");return}
  api("settings","POST",{key:"bpats",value:BPATS}).then(function(){editB=false;renderDay();toast("メニューを保存しました")}).catch(function(e){toast(e.message)})}

/* 営業日の型（お店が変えられる） */
function patEditor(){
  var h="<div class='pe'><div class='note' style='margin-bottom:4px'>名前と時間を変えられます。よく使う形を作っておくと、毎月の入力が速くなります（最大6つ）。</div>";
  PATS.forEach(function(p,i){
    h+="<div class='r'><input type='text' value='"+esc(p.name)+"' maxlength='6' oninput='PATS["+i+"].name=this.value'>"+
       "<select onchange='PATS["+i+"].s=this.value'>"+opts(p.s)+"</select>〜<select onchange='PATS["+i+"].e=this.value'>"+opts(p.e)+"</select>"+
       "<button class='x' onclick='delPat("+i+")'>✕</button></div>"});
  h+="<div class='acts'>"+(PATS.length<6?"<button style='border:1px solid var(--main);color:var(--main);background:#fff' onclick='addPat()'>＋ 型を足す</button>":"")+
     "<button style='border:0;background:var(--main);color:#fff' onclick='savePat()'>完了</button></div></div>";
  return h;
}
function addPat(){PATS.push({name:"新しい型",s:"10:00",e:"15:00"});renderAdmin()}
function delPat(i){if(PATS.length<=1){toast("型は1つ以上いります");return}PATS.splice(i,1);if(pat>=PATS.length)pat=0;renderAdmin()}
function savePat(){
  for(var i=0;i<PATS.length;i++){var p=PATS[i];if(!p.name.trim()){toast("名前を入れてください");return}if(m2(p.s)>=m2(p.e)){toast("「"+p.name+"」の終わりを始まりより後にしてください");return}}
  api("settings","POST",{key:"pats",value:PATS}).then(function(){return api("settings","POST",{key:"step",value:SHOP.stepMin})})
  .then(function(){editPat=false;renderAdmin();toast("営業時間の組み合わせを保存しました（入れた営業日は変わりません）")}).catch(function(e){toast(e.message)})}

/* ---------- 最初：お店の設定を読む → パスワード ---------- */
fetch("/shop.jsonc",{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){
  SHOP=parseJsonc(t);
  var R=document.documentElement.style;R.setProperty("--main",SHOP.color.main);R.setProperty("--sub",SHOP.color.sub);
  document.title=SHOP.shopName+" 予約管理";document.getElementById("ttl").textContent=SHOP.shopName+"　予約管理";
  if(SHOP.demo===true&&SHOP.demoPassword){var dp=document.getElementById("demoPw");dp.textContent="デモ用のパスワード："+SHOP.demoPassword;dp.style.display="block"}   // デモだけ（本番の shop.jsonc には demoPassword を書かない）
  for(var m=6*60;m<=23*60;m+=SHOP.stepMin)tOpts.push(t2(m));
  if(getPw()){api("login","POST",{}).then(function(){start()}).catch(function(e){showLogin(e.message=="パスワードが違います"?"前のパスワードが使えなくなりました。もう一度入れてください":e.message)})}
  else showLogin("");
}).catch(function(){showLogin("お店の設定（shop.jsonc）が読めません")});
</script>
</body>
